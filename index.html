    // Catch the browser's install offer early, before the app has loaded
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__bip = e;
      window.dispatchEvent(new Event('bip-ready'));
    });

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    /* Custom scrollbar for aesthetic */
    ::-webkit-scrollbar {
      width: 0px;
    }

    @keyframes shrink {
      from {
        width: 100%;
      }

      to {
        width: 0%;
      }
    }

    /* ---------- Launch splash: the same snow globe as the app icon, coming to life ---------- */
    /* The phone's own launch screen shows the globe on this exact colour, so the hand-over is seamless. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #07150d;
      transition: opacity .9s ease, visibility .9s ease;
      overflow: hidden;
    }
    #splash::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 42%, #0f3d24 0%, #07150d 62%);
      opacity: 0; animation: gl-fade 1.4s ease-out .3s forwards;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes gl-fade { to { opacity: 1; } }
    #splash .snow { position: absolute; inset: 0; pointer-events: none; opacity: 0; animation: gl-fade 1.2s ease-out 1.4s forwards; }
    #splash .snow i {
      position: absolute; top: -10px; border-radius: 50%; background: #fff;
      opacity: 0; animation: sp-fall linear infinite;
    }
    @keyframes sp-fall {
      0% { transform: translate3d(0,-10px,0); opacity: 0; }
      10% { opacity: .9; }
      100% { transform: translate3d(var(--dx),105vh,0); opacity: .2; }
    }
    #splash .globe { position: relative; width: min(52vw, 250px); height: auto; overflow: visible; animation: gl-wobble 1.4s ease-in-out 2.1s 1; transform-origin: 50% 85%; }
    @keyframes gl-wobble {
      0%,100% { transform: rotate(0); } 20% { transform: rotate(-5deg); } 45% { transform: rotate(4deg); }
      70% { transform: rotate(-2deg); }
    }
    #splash .tree-part { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: gl-grow .7s cubic-bezier(.2,1.3,.4,1) forwards; }
    #splash .tree-part.p1 { animation-delay: .35s; }
    #splash .tree-part.p2 { animation-delay: .6s; }
    #splash .tree-part.p3 { animation-delay: .85s; }
    @keyframes gl-grow { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    #splash .gl-star { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sp-star .9s cubic-bezier(.2,1.4,.4,1) 1.25s forwards, sp-glow 1.8s ease-in-out 2.3s infinite; }
    @keyframes sp-star { from { opacity: 0; transform: scale(0) rotate(-140deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes sp-glow { 0%,100% { filter: drop-shadow(0 0 3px #f2d56b); } 50% { filter: drop-shadow(0 0 12px #fff1a1); } }
    #splash .flake { fill: #fff; opacity: 0; animation: gl-flake linear infinite; }
    @keyframes gl-flake {
      0% { transform: translate(0,-30px); opacity: 0; } 12% { opacity: .9; } 100% { transform: translate(var(--fx),290px); opacity: .1; }
    }
    #splash .gl-bulb { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sp-pop .4s cubic-bezier(.2,1.6,.4,1) forwards, sp-twinkle 1.6s ease-in-out infinite; }
    @keyframes sp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes sp-twinkle { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.8); } }
    #splash h1 {
      position: relative; margin: 14px 0 0; font-family: 'Great Vibes', cursive; font-weight: 400;
      font-size: clamp(34px, 8vw, 54px); color: #fff1a1; letter-spacing: .02em; text-align: center;
      text-shadow: 0 0 18px rgba(242,226,78,.55);
      opacity: 0; transform: translateY(12px); animation: sp-text 1s ease-out 1.5s forwards;
    }
    #splash p {
      position: relative; margin: 6px 0 0; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .35em; text-transform: uppercase;
      color: rgba(255,255,255,.6); opacity: 0; animation: sp-text 1s ease-out 1.8s forwards;
    }
    @keyframes sp-text { to { opacity: 1; transform: translateY(0); } }
    #splash .bar { position: relative; margin-top: 26px; width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; opacity: 0; animation: sp-text .6s ease-out 1.9s forwards; }
    #splash .bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #f2e24e, transparent); animation: sp-load 1.2s ease-in-out infinite; }
    @keyframes sp-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash, #splash::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
