    body,

      margin: 0;

      background-color: #050505;
    }

    #root {
      width: 100%;
      height: 100%;

    /* Custom scrollbar for aesthetic */

      width: 0px;

    @keyframes shrink {
      from {
        width: 100%;
      }

      to {
        width: 0%;
      }
    }

    /* ---------- Launch splash ---------- */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #0f3d24 0%, #07150d 55%, #050505 100%);
      transition: opacity .9s ease, visibility .9s ease;
      overflow: hidden;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .snow { position: absolute; inset: 0; pointer-events: none; }
    #splash .snow i {
      position: absolute; top: -10px; border-radius: 50%; background: #fff;
      opacity: 0; animation: sp-fall linear infinite;
    }
    @keyframes sp-fall {
      0% { transform: translate3d(0,-10px,0); opacity: 0; }
      10% { opacity: .9; }
      100% { transform: translate3d(var(--dx),105vh,0); opacity: .2; }
    }
    #splash .logo { width: min(44vw, 220px); height: auto; overflow: visible; filter: drop-shadow(0 0 28px rgba(46,224,127,.35)); }
    #splash .tier {
      fill: #1fb865; fill-opacity: 0; stroke: #7dffb8; stroke-width: 3; stroke-linejoin: round;
      stroke-dasharray: 700; stroke-dashoffset: 700;
      animation: sp-draw 1.3s ease-out forwards, sp-fill .8s ease-out forwards;
    }
    #splash .tier.t1 { animation-delay: .15s, 1.1s; }
    #splash .tier.t2 { animation-delay: .35s, 1.25s; }
    #splash .tier.t3 { animation-delay: .55s, 1.4s; }
    @keyframes sp-draw { to { stroke-dashoffset: 0; } }
    @keyframes sp-fill { to { fill-opacity: 1; stroke: #2ee07f; } }
    #splash .trunk { fill: #7a4a21; opacity: 0; animation: sp-pop .5s ease-out 1.5s forwards; }
    #splash .star {
      fill: #f2e24e; opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: sp-star .9s cubic-bezier(.2,1.4,.4,1) 1.7s forwards, sp-glow 1.8s ease-in-out 2.6s infinite;
    }
    @keyframes sp-star { from { opacity: 0; transform: scale(0) rotate(-140deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes sp-glow { 0%,100% { filter: drop-shadow(0 0 4px #f2e24e); } 50% { filter: drop-shadow(0 0 16px #fff1a1); } }
    #splash .orn { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sp-pop .45s cubic-bezier(.2,1.6,.4,1) forwards, sp-twinkle 1.6s ease-in-out infinite; }
    @keyframes sp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes sp-twinkle { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.7); } }
    #splash h1 {
      margin: 18px 0 0; font-family: 'Great Vibes', cursive; font-weight: 400;
      font-size: clamp(34px, 8vw, 54px); color: #fff1a1; letter-spacing: .02em; text-align: center;
      text-shadow: 0 0 18px rgba(242,226,78,.55);
      opacity: 0; transform: translateY(12px); animation: sp-text 1s ease-out 2.0s forwards;
    }
    #splash p {
      margin: 6px 0 0; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .35em; text-transform: uppercase;
      color: rgba(255,255,255,.6); opacity: 0; animation: sp-text 1s ease-out 2.3s forwards;
    }
    @keyframes sp-text { to { opacity: 1; transform: translateY(0); } }
    #splash .bar { margin-top: 26px; width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; opacity: 0; animation: sp-text .6s ease-out 2.4s forwards; }
    #splash .bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #f2e24e, transparent); animation: sp-load 1.2s ease-in-out infinite; }
    @keyframes sp-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
